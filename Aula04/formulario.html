<!DOCTYPE html>
<!-- lang="pt-BR" informa ao navegador e aos leitores de tela o idioma da página -->
<html lang="pt-BR">
<head>
    <!-- charset UTF-8: permite acentos e ç sem quebrar (á, ã, ê, ç) -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- viewport: faz a página se adaptar à largura da tela (responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola Virtual</title>

    <!-- Liga o arquivo de estilos. Precisa estar na MESMA pasta deste HTML -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--
        action = para onde os dados vão quando o formulário é enviado
        method = "post" envia os dados escondidos no corpo da requisição
                 ("get" colocaria tudo visível na URL)
    -->
    <form action="processar.php" method="post">

        <!-- ========== SEÇÃO 1: DADOS PESSOAIS ========== -->
        <div class="secao">
            <span class="secao-titulo">Dados Pessoais</span>

            <!-- grid-2 = duas colunas de largura igual -->
            <div class="grid-2">

                <!--
                    O atributo "for" do label aponta para o "id" do input.
                    Isso faz o clique no texto focar o campo, e é o que
                    permite ao leitor de tela anunciar o rótulo correto.
                -->
                <div class="campo">
                    <label for="nome">Nome do Aluno</label>
                    <!-- required = o navegador bloqueia o envio se estiver vazio -->
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="campo">
                    <label for="email">E-Mail</label>
                    <!-- type="email" valida o formato automaticamente -->
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="nome_mae">Nome da Mãe</label>
                    <input type="text" id="nome_mae" name="nome_mae" required>
                </div>
                <div class="campo">
                    <label for="nome_pai">Nome do Pai</label>
                    <!-- Sem "required": nem todo aluno tem o dado do pai -->
                    <input type="text" id="nome_pai" name="nome_pai">
                </div>
            </div>

            <!--
                Reaproveita a grade de 6 colunas do Endereço (.grid-endereco):
                Telefone/CPF/CEP em uma linha de 3 (col-2 cada, 2+2+2=6) e
                Nascimento/Idade em uma linha de 2 (col-3 cada, 3+3=6).
            -->
            <div class="grid-endereco campo-documentos">

                <div class="campo col-2">
                    <label for="telefone">Telefone</label>
                    <!-- type="tel" abre o teclado numérico no celular -->
                    <input type="tel" id="telefone" name="telefone" placeholder="(61) 9 9999-9999" required>
                </div>
                <div class="campo col-2">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="campo col-2">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                </div>

                <div class="campo col-3">
                    <label for="nascimento">Nascimento</label>
                    <!-- type="date" abre o seletor de calendário do navegador -->
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
                <div class="campo col-3">
                    <label for="idade">IDADE</label>
                    <!--
                        readonly: o valor ainda é enviado no submit, mas o
                        usuário não consegue digitar aqui. Quem preenche é
                        o script lá embaixo, a partir da Data de Nascimento,
                        pra idade nunca ficar errada ou desatualizada.
                    -->
                    <input type="text" id="idade" name="idade" readonly required>
                </div>

            </div>
        </div>

        <!-- ========== SEÇÃO 2: ENDEREÇO ========== -->
        <div class="secao">
            <span class="secao-titulo">Endereço</span>

            <!--
                grid-endereco tem 6 colunas invisíveis.
                Cada campo diz quantas colunas ocupa com col-2, col-3, col-4.
                Como 6 é divisível por 2 e por 3, a mesma grade aceita
                linhas de 2 campos E linhas de 3 campos.
            -->
            <div class="grid-endereco">

                <!-- Linha 1: 4 + 2 = 6 colunas -->
                <div class="campo col-4">
                    <label for="logradouro">Logradouro</label>
                    <input type="text" id="logradouro" name="logradouro" required>
                </div>
                <div class="campo col-2">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" required>
                </div>

                <!-- Linha 2: 3 + 3 = 6 colunas -->
                <div class="campo col-3">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento">
                </div>
                <div class="campo col-3">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>

                <!-- Linha 3: 2 + 2 + 2 = 6 colunas -->
                <div class="campo col-2">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                <div class="campo col-2">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" name="estado" required>
                </div>
                <div class="campo col-2">
                    <label for="ibge">Código IBGE</label>
                    <input type="text" id="ibge" name="ibge" placeholder="0000000">
                </div>

            </div>
        </div>

        <!-- ========== SEÇÃO 3: INFORMAÇÕES DE MATRÍCULA ========== -->
        <div class="secao">
            <span class="secao-titulo">Informações de Matrícula</span>

            <div class="grid-3">

                <div class="campo">
                    <label for="serie">Série</label>
                    <!--
                        O JavaScript lê o atributo "value", não o texto visível.
                        Por isso o valor é "5ano" e não "5º ano".
                    -->
                    <select id="serie" name="serie" required>
                        <option value="pre-escolar" selected>Pré-escolar</option>
                        <option value="1ano">1º ano</option>
                        <option value="2ano">2º ano</option>
                        <option value="3ano">3º ano</option>
                        <option value="4ano">4º ano</option>
                        <option value="5ano">5º ano</option>
                    </select>

                    <!--
                        CAIXA CONDICIONAL
                        Começa escondida (display:none no CSS).
                        O script.js adiciona a classe "visivel" quando
                        o usuário escolhe "5º ano".
                    -->
                    <div class="caixa-condicional" id="caixa-quinto-ano">
                        <label for="obs_quinto">Observações do 5º ano</label>
                        <input type="text" id="obs_quinto" name="obs_quinto">
                    </div>
                </div>

                <div class="campo">
                    <!--
                        Sem "for" porque este label descreve o GRUPO inteiro,
                        não um campo específico.
                    -->
                    <label>Turno</label>
                    <div class="opcoes">
                        <!--
                            RADIO: mesmo "name" = mesmo grupo.
                            Só uma opção pode ficar marcada por vez.
                        -->
                        <label><input type="radio" name="turno" value="manha" required> Manhã</label>
                        <label><input type="radio" name="turno" value="tarde" required> Tarde</label>
                    </div>
                </div>

                <div class="campo">
                    <label>Atividades Extracurriculares</label>
                    <div class="opcoes">
                        <!--
                            CHECKBOX: pode marcar várias ao mesmo tempo.
                            Esta é a diferença principal entre radio e checkbox.
                        -->
                        <label><input type="checkbox" name="atividades" value="informatica"> Informática</label>
                        <label><input type="checkbox" name="atividades" value="musica"> Música</label>
                        <label><input type="checkbox" name="atividades" value="balet"> Balet</label>
                        <label><input type="checkbox" name="atividades" value="pintura"> Pintura</label>
                        <label><input type="checkbox" name="atividades" value="judo"> Judô</label>
                        <label><input type="checkbox" name="atividades" value="futebol"> Futebol</label>
                    </div>
                </div>

            </div>
        </div>

        <div class="botoes">
            <!-- submit = envia; reset = limpa todos os campos -->
            <input type="submit" value="Envia Formulário">
            <input type="reset" value="Limpa Campos">
        </div>

    </form>

    <!--
        O script fica no FIM do body de propósito:
        assim o HTML já existe quando o JavaScript tenta encontrar
        os elementos com getElementById.
    -->
    <script>
        const campoCep = document.getElementById('cep');
        campoCep.addEventListener('input', function(){
            let valor= this.value.replace(/\D/g, '');
            if(valor.length > 5){
                valor = valor.slice(0,5) + '-' + valor.slice(5,8);
            }
            this.value = valor;

            // Só busca quando o CEP estiver completo (8 dígitos, sem o traço)
            if(valor.replace(/\D/g, '').length === 8){
                buscarEndereco(valor);
            }
        });

        // ========== ENDEREÇO: preenchido automaticamente a partir do CEP ==========
        // ViaCEP é uma API pública e gratuita, não precisa de chave de acesso.
        // fetch() faz a requisição; o primeiro .then() converte a resposta
        // pra JSON e o segundo .then() já recebe os dados prontos pra usar.
        function buscarEndereco(cep){
            const cepLimpo = cep.replace(/\D/g, '');

            fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                .then(function(resposta){
                    return resposta.json();
                })
                .then(function(dados){
                    // A API devolve { erro: true } quando o CEP não existe
                    if(dados.erro){
                        alert('CEP não encontrado.');
                        return;
                    }

                    document.getElementById('logradouro').value = dados.logradouro;
                    document.getElementById('bairro').value = dados.bairro;
                    document.getElementById('cidade').value = dados.localidade;
                    document.getElementById('estado').value = dados.uf;
                    document.getElementById('ibge').value = dados.ibge;

                    // Número não vem da API (a rua toda tem o mesmo CEP),
                    // então o foco vai pro campo que falta o usuário preencher
                    document.getElementById('numero').focus();
                })
                .catch(function(){
                    // .catch pega falha de rede (sem internet, API fora do ar etc.)
                    alert('Não foi possível buscar o CEP. Verifique sua conexão.');
                });
        }

        const campoCpf = document.getElementById('cpf');
        campoCpf.addEventListener('input', function(){
            let valor= this.value.replace(/\D/g, '');
            if(valor.length > 11){
                valor = valor.slice(0,3) + '.' + valor.slice(3,6) + '.' + valor.slice(6,9) + '-' + valor.slice(9,11);
            }
            this.value = valor;
        });

        const campoTelefone = document.getElementById('telefone');
        campoTelefone.addEventListener('input', function () {
            // Corta em 11 dígitos: DDD (2) + 9 (1) + 4 + 4
            const d = this.value.replace(/\D/g, '').slice(0, 11);

            let valor = '';
            if (d.length > 0)  valor  = '(' + d.slice(0, 2);
            if (d.length >= 3) valor += ') ' + d.slice(2, 3);
            if (d.length >= 4) valor += ' ' + d.slice(3, 7);
            if (d.length >= 8) valor += '-' + d.slice(7, 11);

            this.value = valor;
        });

        // ========== SÉRIE: mostra a caixa de observações só no 5º ano ==========
        // Isso é o que os comentários acima do HTML já descreviam, mas que
        // não existia de fato: faltava este listener escutar o <select>.
        const campoSerie = document.getElementById('serie');
        const caixaQuintoAno = document.getElementById('caixa-quinto-ano');
        campoSerie.addEventListener('change', function(){
            // .visivel é a classe que o CSS usa pra trocar display:none por display:block
            if(this.value === '5ano'){
                caixaQuintoAno.classList.add('visivel');
            } else {
                caixaQuintoAno.classList.remove('visivel');
            }
        });

        // ========== IDADE: calculada a partir da Data de Nascimento ==========
        // O campo idade é "readonly" no HTML, então o único jeito de ele
        // mudar de valor é por aqui — assim nunca fica errado ou desatualizado.
        const campoNascimento = document.getElementById('nascimento');
        const campoIdade = document.getElementById('idade');
        campoNascimento.addEventListener('change', function(){
            if(!this.value){
                campoIdade.value = '';
                return;
            }

            // "T00:00:00" evita que o fuso horário jogue a data um dia pra trás
            const nascimento = new Date(this.value + 'T00:00:00');
            const hoje = new Date();

            let idade = hoje.getFullYear() - nascimento.getFullYear();

            // Só soma a idade do ano corrente se o aniversário já tiver passado (ou for hoje)
            const aniversarioJaPassou =
                hoje.getMonth() > nascimento.getMonth() ||
                (hoje.getMonth() === nascimento.getMonth() && hoje.getDate() >= nascimento.getDate());

            if(!aniversarioJaPassou){
                idade--;
            }

            campoIdade.value = idade + ' anos';
        });

    </script>
</body>
</html>
